<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVG Bezier Curves Template</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; color: white; }
        .canvas { position: relative; width: 100vw; height: 100vh; }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        path { fill: none; stroke: #00ffcc; stroke-width: 3; }

        .node {
            position: absolute; width: 100px; height: 100px; background: #444; border-radius: 8px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* ポート（接続点）のスタイル */
        .port {
            width: 12px; height: 12px; background: #888; border-radius: 50%;
            position: absolute; border: 2px solid #222;
        }
        .port.out { right: -8px; top: 50%; transform: translateY(-50%); }
        .port.in { left: -8px; top: 50%; transform: translateY(-50%); }
    </style>
</head>
<body>
    <div class="canvas">
        <svg id="svg-layer"></svg>

        <div class="node" id="node1" style="left: 100px; top: 150px;">
            Node 1
            <div class="port out" id="port1"></div>
        </div>

        <div class="node" id="node2" style="left: 400px; top: 250px;">
            Node 2
            <div class="port in" id="port2"></div>
        </div>
    </div>

    <script>
        // SVGを使った要素間の曲線描画
        const svgLayer = document.getElementById('svg-layer');
        const node2 = document.getElementById('node2');
        const port1 = document.getElementById('port1');
        const port2 = document.getElementById('port2');

        function updateConnection() {
            svgLayer.innerHTML = ''; // 既存の線をクリア

            const rect1 = port1.getBoundingClientRect();
            const rect2 = port2.getBoundingClientRect();

            // ポートの中心座標を計算
            const x1 = rect1.left + rect1.width / 2;
            const y1 = rect1.top + rect1.height / 2;
            const x2 = rect2.left + rect2.width / 2;
            const y2 = rect2.top + rect2.height / 2;

            // SVG Path要素を作成
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

            // コントロールポイントを計算してS字曲線（ベジェ曲線）にする
            const cp1x = x1 + Math.abs(x2 - x1) * 0.5;
            const cp2x = x2 - Math.abs(x2 - x1) * 0.5;

            path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${y2}, ${x2} ${y2}`);

            svgLayer.appendChild(path);
        }

        // 初回描画
        updateConnection();

        // ノードを移動させて線が追従するのをテスト
        let isDragging = false;
        let startPos = { x: 0, y: 0 };

        node2.addEventListener('mousedown', (e) => {
            isDragging = true;
            startPos = { x: e.clientX - node2.offsetLeft, y: e.clientY - node2.offsetTop };
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                node2.style.left = (e.clientX - startPos.x) + 'px';
                node2.style.top = (e.clientY - startPos.y) + 'px';
                updateConnection(); // ノードが移動するたびに線を再描画
            }
        });

        document.addEventListener('mouseup', () => isDragging = false);
    </script>
</body>
</html>
